# Stack para Portainer.
#
# Um serviço só: o Next serve as páginas e a API na MESMA porta, a 8092. Não há
# serviço de banco aqui — o ERP Voalle (PostgreSQL), o Data Hub (MariaDB) e o
# Redis são externos e já existem; este container só os consulta, sempre em
# leitura.
#
# Em Portainer: Stacks -> Add stack -> Repository, apontando para o repositório
# deste projeto, e preencha as variáveis abaixo em "Environment variables".
# Nenhum segredo mora neste arquivo, de propósito.
services:
  manutencao-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
      # Sem `args` aqui de propósito, e isso CONTINUA valendo depois do SSO.
      #
      # Diferente do integradoras-dashboard (que precisa das VITE_* dentro do
      # bundle), aqui nem a configuração do Firebase é gravada em tempo de
      # build: ela desce como prop da tela de login, lida do ambiente pelo
      # servidor. Se fossem `NEXT_PUBLIC_*`, trocar o projeto Firebase exigiria
      # RECONSTRUIR A IMAGEM, e a pegadinha clássica seria mudar a variável no
      # Portainer, reiniciar, e o bundle antigo continuar apontando para o
      # projeto velho — sem nada na tela dizendo isso.
      #
      # Trocar qualquer variável abaixo exige só recriar o container.
    image: manutencao-dashboard:1.0.0
    container_name: manutencao-dashboard
    restart: unless-stopped
    ports:
      # host:container — 8080/8081 são do dashboard comercial e 8091 do
      # integradoras; 8092 é a porta deste sistema.
      - "${HOST_PORT:-8092}:8092"
    environment:
      TZ: America/Sao_Paulo
      PORT: 8092

      # ---- ERP Voalle (PostgreSQL, schema `erp`) — SOMENTE LEITURA ----
      # A conexão é uma réplica read-only de produção com 1.384 tabelas.
      # Nunca escrever, nunca criar índice, nunca deixar query sem timeout.
      DB_ELLEVEN_HOST: ${DB_ELLEVEN_HOST}
      DB_ELLEVEN_DATABASE: ${DB_ELLEVEN_DATABASE}
      DB_ELLEVEN_USER: ${DB_ELLEVEN_USER}
      DB_ELLEVEN_PASSWORD: ${DB_ELLEVEN_PASSWORD}
      DB_ELLEVEN_PORT: ${DB_ELLEVEN_PORT:-5432}
      ERP_POOL_MAX: ${ERP_POOL_MAX:-6}

      # ---- Data Hub (MariaDB) — base diária de clientes ----
      # Denominador do Coeficiente de Reparos. Host em IP privado: o container
      # precisa enxergar a rede corporativa.
      MARIA_HOST: ${MARIA_HOST}
      MARIA_DATABASE: ${MARIA_DATABASE:-DB_Applicattion}
      MARIA_USER: ${MARIA_USER}
      MARIA_PASSWORD: ${MARIA_PASSWORD}
      MARIA_PORT: ${MARIA_PORT:-3306}
      MARIA_POOL_MAX: ${MARIA_POOL_MAX:-5}

      # ---- Redis (cache L2) — OPCIONAL ----
      # Sem REDIS_HOST o dashboard funciona igual; o Redis só faz o cache
      # sobreviver ao redeploy.
      # ⚠️ COMPARTILHADO com as outras aplicações do servidor: o prefixo é
      # obrigatório, toda chave tem TTL, e só entra payload até REDIS_MAX_KB
      # para não disputar memória com elas.
      REDIS_HOST: ${REDIS_HOST:-}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_USER: ${REDIS_USER:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PREFIXO: ${REDIS_PREFIXO:-dash:manutencao:}
      REDIS_MAX_KB: ${REDIS_MAX_KB:-512}

      # ---- acesso ao dashboard: SSO com conta Google (Firebase) ----
      # Sem FIREBASE_PROJECT_ID e ALLOWED_DOMAIN o dashboard responde 503 e NÃO
      # abre. É falha fechada de propósito: sem barreira, qualquer um na rede vê
      # nome de cliente, endereço e produtividade individual de técnico.
      #
      # As quatro FIREBASE_* são lidas em RUNTIME (o servidor passa a
      # configuração para a tela de login), e não gravadas no bundle — por isso
      # continuam aqui, em `environment`, e não em `build.args`. Trocar de
      # projeto Firebase é recriar o container, sem rebuild.
      FIREBASE_API_KEY: ${FIREBASE_API_KEY}
      FIREBASE_AUTH_DOMAIN: ${FIREBASE_AUTH_DOMAIN}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      FIREBASE_APP_ID: ${FIREBASE_APP_ID}

      # Quem pode entrar. O `hd` mandado ao Google só filtra o seletor de
      # contas; é esta variável que o servidor confere no token.
      ALLOWED_DOMAIN: ${ALLOWED_DOMAIN:-sebratel.com.br}

      # ---- banco DA APLICAÇÃO: papéis, matriz de acesso e config de IA ----
      # É o único banco onde este sistema escreve. Sem dado de negócio: se
      # sumir, perde-se controle de acesso, não se perde número.
      #
      # ⚠️ OPCIONAL. Sem DASH_HOST o dashboard sobe e funciona, com todo mundo do
      # domínio vendo as 8 telas — e a tela de Configurações diz isso em letras
      # grandes. Falhar fechado aqui deixaria o dashboard inacessível por causa
      # de um recurso acessório.
      #
      # O schema `dash` e as 4 tabelas são criados sozinhos na primeira consulta;
      # o usuário precisa poder criar schema no banco apontado.
      DASH_HOST: ${DASH_HOST:-}
      DASH_PORT: ${DASH_PORT:-5432}
      DASH_DATABASE: ${DASH_DATABASE:-dash}
      DASH_USER: ${DASH_USER:-dash}
      DASH_PASSWORD: ${DASH_PASSWORD:-}
      DASH_POOL_MAX: ${DASH_POOL_MAX:-4}

      # Administradores que a tela não pode rebaixar — a porta de emergência
      # contra ficar sem ninguém capaz de abrir Configurações.
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}

      # ---- limites de memória do cache ----
      # Teto do cache L1 em MB. Precisa caber com folga dentro do
      # --max-old-space-size abaixo: uma entrada de "Ano corrente" de
      # /protocolos mede ~14 MB (medido em 10/09/2026).
      CACHE_MAX_MB: ${CACHE_MAX_MB:-256}

      NODE_OPTIONS: --max-old-space-size=1024
    healthcheck:
      # /api/health não passa pela autenticação de propósito — o wget não manda
      # credencial. A rota não devolve dado de negócio nenhum.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8092/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging:
      # Sem isto o log cresce até encher o disco do host. O app escreve em
      # stdout (nunca em arquivo dentro do container), então a rotação aqui é
      # o único controle que existe.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          # 1,5 GB dá folga sobre o heap de 1 GB. Se algo vazar, o container
          # reinicia e o problema aparece — melhor que o host começar a fazer
          # swap e tudo ficar lento sem causa aparente.
          memory: 1.5g

# Sem `volumes:` de propósito. Diferente do integradoras-dashboard, este app não
# guarda estado em disco: não há papéis/permissões por tela (quem entra é
# qualquer conta @sebratel.com.br, e a lista de contas vive no Firebase) e o
# cache é memória + Redis. O container é descartável — recriar não perde
# configuração de ninguém.
